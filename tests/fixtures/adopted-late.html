<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>late adopted stylesheets fixture</title>
<style>body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; }</style>
<script>
  // A web component that adopts a shared constructable sheet only after hydration,
  // the way Reddit's shreddit-* elements do. Nothing here produces a DOM mutation.
  customElements.define("late-card", class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: "open" });
      root.innerHTML = '<div class="box"><slot></slot></div>';
      const early = new CSSStyleSheet();
      early.replaceSync(".box { padding: 16px; margin: 16px; }");
      root.adoptedStyleSheets = [early];
    }
  });
  setTimeout(() => {
    const shared = new CSSStyleSheet();
    shared.replaceSync(".box { background-color: #ffffff; color: #181c1f; } ::slotted(p) { color: #181c1f; }");
    document.querySelectorAll("late-card").forEach((el) => {
      el.shadowRoot.adoptedStyleSheets = [...el.shadowRoot.adoptedStyleSheets, shared];
    });
    const docSheet = new CSSStyleSheet();
    docSheet.replaceSync(".late-doc { background-color: #f5f5f5; color: #111111; padding: 16px; margin: 16px; }");
    document.adoptedStyleSheets = [...document.adoptedStyleSheets, docSheet];
    // Editing an already adopted sheet in place is just as invisible to observers.
    setTimeout(() => docSheet.insertRule(".late-edit { background-color: #fafafa; color: #222222; padding: 16px; margin: 16px; }"), 1000);
  }, 1500);
</script>
</head>
<body>
  <late-card><p>Slotted paragraph styled by a shadow sheet adopted after load.</p></late-card>
  <div class="late-doc">Document-level sheet adopted after load.</div>
  <div class="late-edit">Rule inserted into an adopted sheet even later.</div>
</body>
</html>
